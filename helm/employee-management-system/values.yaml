# Default values for employee-management-system
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

namespace: employee-management

# Global settings
global:
  environment: dev
  domain: example.com
  tls:
    enabled: true
    issuer: letsencrypt-prod

# Container Registry Settings
registry:
  name: "acrvrush777.azurecr.io"  # Set via GitHub secret
  username: ""
  password: ""
  email: "docker@example.com"

# Frontend Configuration
frontend:
  enabled: true
  name: ems-frontend
  replicaCount: 4

  securityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101

  image:
    repository: "ems-frontend"
    pullPolicy: Always
    tag: "$(Build.BuildId)"

  service:
    type: ClusterIP
    port: 80
    targetPort: 80
    annotations: {}

  ingress:
    enabled: true
    className: "azure-application-gateway"
    annotations: {}
    hosts:
      - host: app.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  affinity: {}
  tolerations: []

# Backend Configuration
backend:
  enabled: true
  name: ems-backend
  replicaCount: 2

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false

  image:
    repository: "ems-backend"
    pullPolicy: Always
    tag: "$(Build.BuildId)"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}

  ingress:
    enabled: true
    className: "azure-application-gateway"
    annotations: {}
    hosts:
      - host: api.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

  nodeSelector: {}
  affinity: {}
  tolerations: []

  # # Spring Boot Application Configuration
  # backend:
  #   config:
  #     spring:
  #       jpa:
  #         hibernate:
  #           ddl-auto: update

  #         properties:
  #           hibernate:
  #             jdbc:
  #               batch_size: 20
  #           order_inserts: true
  #           order_updates: true
  #     datasource:
  #       hikari:
  #         maximum-pool-size: 20
  #         minimum-idle: 5
  #         connection-timeout: 30000
  #         idle-timeout: 600000

# PostgreSQL Configuration
postgresql:
  enabled: true

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: "17.6.0-debian-12-r4"

  auth:
    username: employee_user
    password: "change-me"
    database: employee_db
    existingSecret: employee-management-db-secret

    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  primary:
    persistence:
      enabled: true
      size: 10Gi
      storageClassName: managed-premium

    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi

  metrics:
    enabled: false

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

# Pod Security Policy
podSecurityPolicy:
  enabled: false  # Set to true for production

# Monitoring & Logging
monitoring:
  enabled: false
  prometheus:
    scrapeInterval: 30s
    scrapeTimeout: 10s

logging:
  enabled: false
  loglevel: INFO

# Backup Configuration
backup:
  enabled: false
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 7  # days

# Common labels and annotations
commonLabels: {}

commonAnnotations:
  description: "Employee Management System Helm Chart"
