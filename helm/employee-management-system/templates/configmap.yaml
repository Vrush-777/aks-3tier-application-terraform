{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.backend.name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "employee-management-system.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      port: 8080
      servlet:
        context-path: /

    spring:
      application:
        name: ems-backend

      profiles:
        active: {{ .Values.global.environment }}

      jpa:
        show-sql: false

        hibernate:
          ddl-auto: {{ index .Values.backend.config.spring.jpa.hibernate "ddl-auto" | default "update" }}
          naming:
            physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

        properties:
          hibernate:
            jdbc:
              batch_size: 20
            order_inserts: true
            order_updates: true

      datasource:
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
{{- end }}