{{- if and .Values.backend.enabled .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "employee-management-system.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
{{ include "employee-management-system.labels" . | nindent 4 }}
type: Opaque

stringData:
  username: {{ .Values.postgresql.auth.username | quote }}
  password: {{ .Values.postgresql.auth.password | quote }}
  database: {{ .Values.postgresql.auth.database | quote }}

  postgres-username: {{ .Values.postgresql.auth.username | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  postgres-database: {{ .Values.postgresql.auth.database | quote }}
{{- end }}