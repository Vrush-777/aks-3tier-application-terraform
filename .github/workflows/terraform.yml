name: Terraform Infrastructure Pipeline

on:
  push:
    branches:
      - main

    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main

    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

env:
  TF_VERSION: 1.14.9 # Latest stable version as of June 2024

  TF_VAR_subscription_id: ${{ secrets.TF_VAR_subscription_id }}
  TF_VAR_tenant_id: ${{ secrets.TF_VAR_tenant_id }}
  TF_VAR_resource_group_name: ${{ secrets.TF_VAR_resource_group_name }}
  TF_VAR_location: ${{ secrets.TF_VAR_location }}
  TF_VAR_vnet_name: ${{ secrets.TF_VAR_vnet_name }}
  TF_VAR_acr_name: ${{ secrets.TF_VAR_acr_name }}
  TF_VAR_postgres_server_name: ${{ secrets.TF_VAR_postgres_server_name }}
  TF_VAR_postgres_admin_username: ${{ secrets.TF_VAR_postgres_admin_username }}
  TF_VAR_postgres_admin_password: ${{ secrets.TF_VAR_postgres_admin_password }}
  TF_VAR_appgw_name: ${{ secrets.TF_VAR_appgw_name }}
  TF_VAR_aks_cluster_name: ${{ secrets.TF_VAR_aks_cluster_name }}
  TF_VAR_jumpvm_subnet_address_prefixes: ${{ secrets.TF_VAR_jumpvm_subnet_address_prefixes }}
  TF_VAR_jumpvm_ssh_public_key: ${{ secrets.TF_VAR_jumpvm_ssh_public_key }}

jobs:
  terraform-validation:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/environments/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: |
          terraform fmt -check -recursive ..
        continue-on-error: true

      - name: Clean Terraform Cache
        run: |
          rm -rf ~/.terraform.d
          rm -rf .terraform

      - name: Terraform Init
        id: init
        run: |
          terraform init -upgrade

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: TFLint Check
        continue-on-error: true
        run: |
          curl https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
          tflint --init
          tflint

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Format 🖼️\`${{ steps.fmt.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Init 🔨\`${{ steps.init.outcome }}\`
            
            <details><summary>Validation Details</summary>
            
            \`\`\`
            ${{ steps.validate.outputs.stdout }}
            \`\`\`
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: terraform-validation
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    defaults:
      run:
        working-directory: ./terraform/environments/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Clean Terraform Cache
        run: |
          rm -rf ~/.terraform.d
          rm -rf .terraform

      - name: Terraform Init
        run: |
          terraform init -upgrade


      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Save Plan
        run: terraform show -json tfplan > tfplan.json

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ./terraform/environments/dev/tfplan
            ./terraform/environments/dev/tfplan.json

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const planOutput = `${{ steps.plan.outputs.stdout }}`;
            const output = `#### Terraform Plan 📋
            \`\`\`
            ${planOutput.substring(0, 10000)}${planOutput.length > 10000 ? '... (truncated)' : ''}
            \`\`\`
            
            Plan saved as artifact for review.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ./terraform/environments/dev

    environment:
      name: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Clean Terraform Cache
        run: |
          rm -rf ~/.terraform.d
          rm -rf .terraform

      - name: Terraform Init
        run: |
          terraform init -upgrade


      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color

      - name: Terraform Apply
        id: apply
        run: |
          terraform apply -auto-approve -no-color
          terraform output -json > outputs.json

      - name: Capture Outputs
        run: |
          echo "AKS_CLUSTER=$(terraform output -raw aks_cluster_name)" >> $GITHUB_ENV
          echo "ACR_LOGIN=$(terraform output -raw acr_login_server)" >> $GITHUB_ENV
          echo "RESOURCE_GROUP=$(terraform output -raw resource_group_name)" >> $GITHUB_ENV
          echo "ADMIN_GROUPS_CONFIGURED=$(terraform output -raw admin_groups_configured)" >> $GITHUB_ENV

      # =====================================================================
      # CRITICAL: Validate AKS Entra Admin Groups After Apply
      # =====================================================================
      # This step verifies that the AKS cluster has Entra administrator
      # groups configured in its AAD profile. If adminGroupObjectIDs is
      # null or empty, the pipeline FAILS immediately.
      #
      # Why this is necessary:
      #   Even though Terraform validation and lifecycle preconditions
      #   guard against this, a race condition or partial state update
      #   could leave AKS without admin access. This post-apply check
      #   is the final layer of defense.
      #
      # The pipeline MUST fail if:
      #   - adminGroupObjectIDs is null
      #   - adminGroupObjectIDs is an empty array
      # =====================================================================
      - name: Validate AKS Entra Admin Groups
        id: validate-admin-groups
        shell: bash
        run: |
          echo "=========================================="
          echo "🔐 AKS Entra Admin Group Validation"
          echo "=========================================="
          echo "Cluster:      ${AKS_CLUSTER}"
          echo "Resource Grp: ${RESOURCE_GROUP}"
          echo "=========================================="
          echo ""

          # Query the AAD profile directly from Azure
          ADMIN_GROUP_IDS=$(az aks show \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${AKS_CLUSTER}" \
            --query "aadProfile.adminGroupObjectIDs" \
            --output json 2>/dev/null) || {
              echo "❌ FAILED: Unable to query AKS AAD profile."
              echo "   The cluster may not exist or is not accessible."
              exit 1
          }

          echo "Raw result: ${ADMIN_GROUP_IDS}"
          echo ""

          # Check for null
          if [[ "${ADMIN_GROUP_IDS}" == "null" ]]; then
            echo "=========================================="
            echo "❌ CRITICAL FAILURE: AKS Entra admin groups"
            echo "   are NULL. The cluster has NO configured"
            echo "   administrators."
            echo "=========================================="
            echo ""
            echo "Root cause:"
            echo "  az aadProfile.adminGroupObjectIDs returned null."
            echo "  This means the Entra integration was created"
            echo "  without any admin groups."
            echo ""
            echo "Resolution:"
            echo "  1. Ensure aks_admin_group_object_ids is set in"
            echo "     terraform.tfvars with at least one Object ID."
            echo "  2. Run: terraform apply"
            echo "  3. Re-run this pipeline."
            exit 2
          fi

          # Check for empty array
          if [[ "${ADMIN_GROUP_IDS}" == "[]" ]]; then
            echo "=========================================="
            echo "❌ CRITICAL FAILURE: AKS Entra admin groups"
            echo "   are EMPTY."
            echo "=========================================="
            exit 2
          fi

          # Success
          echo "=========================================="
          echo "✅ AKS Entra admin groups are configured."
          echo "   Admin group count: $(echo ${ADMIN_GROUP_IDS} | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 'unknown')"
          echo "=========================================="

      # =====================================================================
      # Terraform Output Summary
      # =====================================================================
      - name: Terraform Output Summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ TERRAFORM APPLY COMPLETED SUCCESSFULLY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "AKS Cluster:            ${{ env.AKS_CLUSTER }}"
          echo "Resource Group:         ${{ env.RESOURCE_GROUP }}"
          echo "ACR Login Server:       ${{ env.ACR_LOGIN }}"
          echo "Admin Groups Configured: ${{ env.ADMIN_GROUPS_CONFIGURED }}"
          echo ""

      - name: Upload Terraform State
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terraform-state-${{ github.run_id }}
          path: ./terraform/environments/dev/
