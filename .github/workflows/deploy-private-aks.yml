name: Build, Push, and Deploy to Private AKS
 
# FIX 4: Deployment Trigger Strategy
# =========================================================================
# RISK: Multiple triggers (workflow_run + push) targeting the same paths
# can cause DUPLICATE DEPLOYMENTS during rapid commits after Terraform runs.
#
# Current configuration:
# - workflow_run: Triggered when "Terraform Infrastructure Pipeline" completes
# - push: Triggered on commits to main with changes in ems-backend/, ems-fullstack/, helm/
# - workflow_dispatch: Manual trigger
#
# RECOMMENDATION - Choose ONE approach:
#
# OPTION A (Recommended):
#   Use workflow_run + workflow_dispatch only
#   - Prevents duplicate deployments after infrastructure changes
#   - Requires manual trigger for non-infrastructure updates
#   - Change: Comment out 'push' trigger below
#
# OPTION B:
#   Use push + workflow_dispatch only
#   - Deploys on every code change
#   - Removes dependency on infrastructure pipeline completion
#   - Change: Comment out 'workflow_run' trigger below
#
# Current Implementation: Both triggers enabled (potential duplicates possible)
# =========================================================================
 
on:
  workflow_run:
    workflows:
      - Terraform Infrastructure Pipeline
    types:
      - completed
 
  push:
    branches:
      - test
    paths:
      - 'ems-backend/**'
      - 'ems-fullstack/**'
      - 'helm/**'
 
 
 
  workflow_dispatch:
 
env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.TF_VAR_TENANT_ID }}
  ACR_NAME: ${{ secrets.TF_VAR_ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.TF_VAR_ACR_NAME }}.azurecr.io
  AKS_CLUSTER_NAME: ${{ secrets.TF_VAR_AKS_CLUSTER_NAME }}
  RESOURCE_GROUP: ${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}
  HELM_CHART_PATH: ./helm/employee-management-system
  DEPLOYMENT_NAMESPACE: employee-management
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain
 
jobs:
  # =========================================================================
  # Job 1: Detect Changes
  # =========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      helm-changed: ${{ steps.changes.outputs.helm }}
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
 
      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'ems-backend/**'
            frontend:
              - 'ems-fullstack/**'
            helm:
              - 'helm/**'
 
  # =========================================================================
  # Job 2: Build Backend
  # =========================================================================
  build-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./ems-backend
 
    outputs:
      backend-image-tag: ${{ steps.image-tag.outputs.tag }}
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
 
      - name: Generate image tag
        id: image-tag
        run: |
          # Use git short SHA for image tag
          TAG=$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"
 
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
 
      - name: Build Backend JAR
        run: mvn clean package -DskipTests -q
 
      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'ems-backend/target/surefire-reports/**/*.xml'
          check_name: 'Backend Test Results'
 
      - name: Azure Login (Service Principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
 
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
 
      - name: Build and Push backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./ems-backend
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/ems-backend:${{ steps.image-tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/ems-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  # =========================================================================
  # Job 3: Build Frontend
  # =========================================================================
  build-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./ems-fullstack
 
    outputs:
      frontend-image-tag: ${{ steps.image-tag.outputs.tag }}
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
 
      - name: Generate image tag
        id: image-tag
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"
 
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './ems-fullstack/package-lock.json'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Build Frontend
        run: npm run build
 
      - name: Azure Login (Service Principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
 
      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
 
      - name: Build and Push frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./ems-fullstack
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/ems-frontend:${{ steps.image-tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/ems-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  # =========================================================================
  # Job 4: Deploy to Private AKS via Jump VM
  # =========================================================================
  deploy-to-aks:
    name: Deploy to Private AKS
    runs-on: ubuntu-latest
    needs:
    - detect-changes
    - build-backend
    - build-frontend  
    if: |
      needs.build-backend.result == 'success' ||
      needs.build-frontend.result == 'success'
 
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
 
      - name: Azure Login (Service Principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
 
      - name: Get Terraform Outputs
        id: terraform
        run: |
          # Get Terraform outputs (requires terraform CLI)
          # For now, using static values from GitHub Secrets
          JUMP_VM_NAME="${{ secrets.JUMP_VM_NAME }}"
          # Determine which image tag to use
            if [ -n "${{ needs.build-backend.outputs.backend-image-tag }}" ]; then
              IMAGE_TAG="${{ needs.build-backend.outputs.backend-image-tag }}"
            elif [ -n "${{ needs.build-frontend.outputs.frontend-image-tag }}" ]; then
              IMAGE_TAG="${{ needs.build-frontend.outputs.frontend-image-tag }}"
            else
              echo "ERROR: No image tag found"
              exit 1
            fi
 
          if [ -z "$JUMP_VM_NAME" ]; then
            echo "ERROR: JUMP_VM_NAME secret not set"
            exit 1
          fi
 
          echo "jump_vm_name=${JUMP_VM_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "resource_group=${RESOURCE_GROUP}" >> $GITHUB_OUTPUT
          echo "aks_cluster=${AKS_CLUSTER_NAME}" >> $GITHUB_OUTPUT
          echo "acr_server=${ACR_LOGIN_SERVER}" >> $GITHUB_OUTPUT
 
      # ========================================================================
      # REQUIREMENT 4: Validate deploy.sh existence before deployment
      # ========================================================================
      - name: Prepare deployment artifacts
        run: |
          echo "Preparing deployment artifacts..."

          echo ""
          echo "================ Git Information ================"
          echo "Current Commit:"
          git rev-parse HEAD

          echo ""
          echo "Current Branch:"
          git branch --show-current

          echo ""
          echo "================ Source values.yaml ================"
          grep -n "className\|type:" "${{ env.HELM_CHART_PATH }}/values.yaml"

          echo ""
          echo "================ Source ingress.yaml ================"
          grep -n "ingressClassName" "${{ env.HELM_CHART_PATH }}/templates/ingress.yaml" || true

          rm -rf deploy-pkg deploy-artifacts.tar.gz

          mkdir -p deploy-pkg

          cp -r "${{ env.HELM_CHART_PATH }}" deploy-pkg/

          echo ""
          echo "================ Packaged values.yaml ================"
          grep -n "className\|type:" deploy-pkg/employee-management-system/values.yaml

          echo ""
          echo "===== Files being packaged ====="
          find deploy-pkg -type f | sort

          tar -czf deploy-artifacts.tar.gz deploy-pkg/

          echo "Helm chart prepared for deployment"
      
      - name: Verify packaged Helm chart
        shell: bash
        run: |
          echo "================ Archive Contents ================"
          tar -tzf deploy-artifacts.tar.gz

          mkdir verify

          tar -xzf deploy-artifacts.tar.gz -C verify

          echo ""
          echo "================ Secret.yaml ================"
          cat verify/deploy-pkg/employee-management-system/templates/secret.yaml

          echo ""
          echo "================ Secret with line numbers ================"
          nl -ba verify/deploy-pkg/employee-management-system/templates/secret.yaml

          echo ""
          echo "================ Helpers ================"
          cat verify/deploy-pkg/employee-management-system/templates/_helpers.tpl

          echo ""
          echo "================ Helpers with line numbers ================"
          nl -ba verify/deploy-pkg/employee-management-system/templates/_helpers.tpl

          echo ""
          echo "================ Chart.yaml ================"
          cat verify/deploy-pkg/employee-management-system/Chart.yaml

          echo ""
          echo "================ Helm Dependency Build ================"
          helm dependency build verify/deploy-pkg/employee-management-system

          echo ""
          echo "================ Backend Deployment Render ================"
          helm template employee-management \
          verify/deploy-pkg/employee-management-system \
          --debug \
          --show-only templates/deployment-backend.yaml

          echo ""
          echo "================ Frontend Deployment Render ================"
          helm template employee-management \
          verify/deploy-pkg/employee-management-system \
          --debug \
          --show-only templates/deployment-frontend.yaml

          echo ""
          echo "================ Full Helm Template ================"
          helm template employee-management \
          verify/deploy-pkg/employee-management-system \
          --debug > rendered.yaml

          echo ""
          echo "================ First 250 lines of rendered.yaml ================"
          head -250 rendered.yaml

          echo ""
          echo "================ Helm Lint ================"
          helm lint verify/deploy-pkg/employee-management-system
 
      - name: Validate deploy.sh exists on Jump VM
        uses: azure/CLI@v1
        with:
          inlineScript: |
            set -e
 
            JUMP_VM_NAME="${{ steps.terraform.outputs.jump_vm_name }}"
            RESOURCE_GROUP="${{ steps.terraform.outputs.resource_group }}"
 
            echo "🔍 Validating deploy.sh exists on Jump VM..."
 
            az vm run-command invoke \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${JUMP_VM_NAME}" \
              --command-id RunShellScript \
              --scripts "
              timeout=600
 
              while [ \$timeout -gt 0 ]; do
                if [ -f /opt/deploy/deploy.sh ]; then
                  echo '✅ deploy.sh found'
                  ls -l /opt/deploy/deploy.sh
 
                  if [ ! -x /opt/deploy/deploy.sh ]; then
                    echo '⚠️ deploy.sh is not executable'
                    chmod 755 /opt/deploy/deploy.sh
                    echo '✅ Permissions fixed'
                  fi
 
                  exit 0
                  fi
 
                  echo '⏳ Waiting for cloud-init to complete...'
                  sleep 30
                  timeout=\$((timeout-30))
                done
 
                echo '❌ Timeout waiting for deploy.sh'
                exit 1
              " \
              --query 'value[0].message' \
              --output tsv
 
      # ========================================================================
      # FIX 1: Improved deployment success detection
      # Requires: deploy.sh prints "DEPLOYMENT_STATUS=SUCCESS" on successful completion
      # See: terraform/scripts/jumpvm-cloud-init.yaml - add after helm upgrade --install
      # ========================================================================
      - name: Deploy via Jump VM - Run Command
        id: deploy
        uses: azure/CLI@v1
        with:
          inlineScript: |
            set -e
 
            JUMP_VM_NAME="${{ steps.terraform.outputs.jump_vm_name }}"
            IMAGE_TAG="${{ steps.terraform.outputs.image_tag }}"
            RESOURCE_GROUP="${{ steps.terraform.outputs.resource_group }}"
            AKS_CLUSTER="${{ steps.terraform.outputs.aks_cluster }}"
            ACR_SERVER="${{ steps.terraform.outputs.acr_server }}"
            SUBSCRIPTION_ID="${{ env.AZURE_SUBSCRIPTION_ID }}"
 
            echo "🚀 Starting deployment to private AKS cluster..."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Jump VM: ${JUMP_VM_NAME}"
            echo "Resource Group: ${RESOURCE_GROUP}"
            echo "AKS Cluster: ${AKS_CLUSTER}"
            echo "Image Tag: ${IMAGE_TAG}"
            echo "ACR Server: ${ACR_SERVER}"
            echo "Subscription ID: ${SUBSCRIPTION_ID}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
 
            # ════════════════════════════════════════════════════════════════════
            # DEBUG 1: Verify deploy-artifacts.tar.gz exists and has content
            # ════════════════════════════════════════════════════════════════════
            if [ ! -f deploy-artifacts.tar.gz ]; then
              echo "❌ ERROR: deploy-artifacts.tar.gz not found"
              exit 1
            fi
           
            ARCHIVE_SIZE=$(stat -f%z deploy-artifacts.tar.gz 2>/dev/null || stat -c%s deploy-artifacts.tar.gz 2>/dev/null)
            echo "✅ Archive file size: ${ARCHIVE_SIZE} bytes"
 
            # ════════════════════════════════════════════════════════════════════
            # Encode chart archive to base64 for transmission
            # ════════════════════════════════════════════════════════════════════
            CHART_ARCHIVE_B64="$(base64 -w0 deploy-artifacts.tar.gz)"
            REMOTE_CHART_ARCHIVE="/tmp/deploy-artifacts-${{ github.run_id }}.tar.gz"
 
            echo "✅ Base64 encoding complete (length: ${#CHART_ARCHIVE_B64} chars)"
            echo "✅ Remote archive path: ${REMOTE_CHART_ARCHIVE}"
 
            # ════════════════════════════════════════════════════════════════════
            # FIXED: Generate invoke-deploy.sh with proper quoting and argument passing
            # ════════════════════════════════════════════════════════════════════
            cat > invoke-deploy.sh <<'DEPLOY_WRAPPER_SCRIPT'
            #!/bin/bash
            set -e
 
            # Extract passed variables from the deployment script
            CHART_ARCHIVE_B64_CONTENT="CHART_ARCHIVE_B64_PLACEHOLDER"
            REMOTE_CHART_ARCHIVE="REMOTE_CHART_ARCHIVE_PLACEHOLDER"
            RESOURCE_GROUP_ARG="RESOURCE_GROUP_PLACEHOLDER"
            AKS_CLUSTER_ARG="AKS_CLUSTER_PLACEHOLDER"
            IMAGE_TAG_ARG="IMAGE_TAG_PLACEHOLDER"
            ACR_SERVER_ARG="ACR_SERVER_PLACEHOLDER"
            SUBSCRIPTION_ID_ARG="SUBSCRIPTION_ID_PLACEHOLDER"
 
            echo "────────────────────────────────────────────────────────────"
            echo "📝 Deployment Arguments Received:"
            echo "────────────────────────────────────────────────────────────"
            echo "Arg 1 (RESOURCE_GROUP): '${RESOURCE_GROUP_ARG}'"
            echo "Arg 2 (AKS_CLUSTER): '${AKS_CLUSTER_ARG}'"
            echo "Arg 3 (IMAGE_TAG): '${IMAGE_TAG_ARG}'"
            echo "Arg 4 (ACR_SERVER): '${ACR_SERVER_ARG}'"
            echo "Arg 5 (SUBSCRIPTION_ID): '${SUBSCRIPTION_ID_ARG}'"
            echo "Arg 6 (CHART_ARCHIVE): '${REMOTE_CHART_ARCHIVE}'"
            echo "────────────────────────────────────────────────────────────"
 
            # Decode base64 chart archive
            echo ""
            echo "📦 Decoding chart archive..."
            echo "${CHART_ARCHIVE_B64_CONTENT}" | base64 -d > "${REMOTE_CHART_ARCHIVE}"
           
            if [ ! -f "${REMOTE_CHART_ARCHIVE}" ]; then
              echo "❌ ERROR: Failed to decode chart archive"
              exit 1
            fi
           
            ARCHIVE_SIZE=$(stat -f%z "${REMOTE_CHART_ARCHIVE}" 2>/dev/null || stat -c%s "${REMOTE_CHART_ARCHIVE}" 2>/dev/null)
            echo "✅ Chart archive decoded: ${ARCHIVE_SIZE} bytes at ${REMOTE_CHART_ARCHIVE}"
 
            # Validate deploy.sh exists
            if [ ! -x /opt/deploy/deploy.sh ]; then
              echo "❌ ERROR: /opt/deploy/deploy.sh not found or not executable"
              ls -la /opt/deploy/ || true
              exit 1
            fi
 
            echo ""
            echo "🚀 Invoking deploy.sh with all arguments..."
            echo "────────────────────────────────────────────────────────────"
 
            # Call deploy.sh with all 6 required arguments
            # Using eval with quoted arguments to preserve whitespace
            eval "/opt/deploy/deploy.sh" \
              "\"${RESOURCE_GROUP_ARG}\"" \
              "\"${AKS_CLUSTER_ARG}\"" \
              "\"${IMAGE_TAG_ARG}\"" \
              "\"${ACR_SERVER_ARG}\"" \
              "\"${SUBSCRIPTION_ID_ARG}\"" \
              "\"${REMOTE_CHART_ARCHIVE}\""
 
            DEPLOY_RESULT=$?
 
            echo "────────────────────────────────────────────────────────────"
            if [ ${DEPLOY_RESULT} -eq 0 ]; then
              echo "✅ Deploy script exited successfully"
            else
              echo "❌ Deploy script exited with code: ${DEPLOY_RESULT}"
              exit ${DEPLOY_RESULT}
            fi
            DEPLOY_WRAPPER_SCRIPT
 
            # ════════════════════════════════════════════════════════════════════
            # DEBUG 2: Substitute actual values into the wrapper script
            # ════════════════════════════════════════════════════════════════════
            sed -i "s|CHART_ARCHIVE_B64_PLACEHOLDER|${CHART_ARCHIVE_B64}|g" invoke-deploy.sh
            sed -i "s|REMOTE_CHART_ARCHIVE_PLACEHOLDER|${REMOTE_CHART_ARCHIVE}|g" invoke-deploy.sh
            sed -i "s|RESOURCE_GROUP_PLACEHOLDER|${RESOURCE_GROUP}|g" invoke-deploy.sh
            sed -i "s|AKS_CLUSTER_PLACEHOLDER|${AKS_CLUSTER}|g" invoke-deploy.sh
            sed -i "s|IMAGE_TAG_PLACEHOLDER|${IMAGE_TAG}|g" invoke-deploy.sh
            sed -i "s|ACR_SERVER_PLACEHOLDER|${ACR_SERVER}|g" invoke-deploy.sh
            sed -i "s|SUBSCRIPTION_ID_PLACEHOLDER|${SUBSCRIPTION_ID}|g" invoke-deploy.sh
 
            # ════════════════════════════════════════════════════════════════════
            # DEBUG 3: Print the complete generated invoke-deploy.sh (without base64)
            # ════════════════════════════════════════════════════════════════════
            echo ""
            echo "📄 Generated invoke-deploy.sh (first 100 lines):"
            echo "════════════════════════════════════════════════════════════════════"
            head -100 invoke-deploy.sh | sed 's/[A-Za-z0-9+/=]\{64,\}/<<<BASE64_CONTENT_TRUNCATED>>>/g'
            echo "════════════════════════════════════════════════════════════════════"
            echo ""
 
            # Verify script size
            SCRIPT_SIZE=$(wc -c < invoke-deploy.sh)
            echo "✅ Generated script size: ${SCRIPT_SIZE} bytes"
            echo ""
 
            # ════════════════════════════════════════════════════════════════════
            # DEBUG 4: Execute the deployment script on Jump VM
            # ════════════════════════════════════════════════════════════════════
            echo "🌐 Sending deployment script to Jump VM: ${JUMP_VM_NAME}"
            echo ""
 
            set +e
            DEPLOY_MESSAGE=$(az vm run-command invoke \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${JUMP_VM_NAME}" \
              --command-id RunShellScript \
              --scripts "$(cat invoke-deploy.sh)" \
              --query 'value[0].message' \
              --output tsv 2>&1)
            DEPLOY_EXIT_CODE=$?
            set -e
 
            echo ""
            echo "📋 Deployment Output:"
            echo "════════════════════════════════════════════════════════════════════"
            echo "${DEPLOY_MESSAGE}"
            echo "════════════════════════════════════════════════════════════════════"
            echo ""
 
            if [ "${DEPLOY_EXIT_CODE}" -ne 0 ]; then
              echo ""
              echo "❌ Azure VM Run Command failed with exit code ${DEPLOY_EXIT_CODE}"
              exit "${DEPLOY_EXIT_CODE}"
            fi
 
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
 
            # DEBUG 5: Verify deployment success
            # deploy.sh MUST print "DEPLOYMENT_STATUS=SUCCESS" on successful completion
            echo ""
            echo "Verifying Helm release..."

            VERIFY_OUTPUT=$(az vm run-command invoke \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${JUMP_VM_NAME}" \
              --command-id RunShellScript \
              --scripts "
                helm status employee-management -n employee-management >/dev/null 2>&1

                kubectl rollout status deployment/ems-backend -n employee-management --timeout=30s >/dev/null

                kubectl rollout status deployment/ems-frontend -n employee-management --timeout=30s >/dev/null

                kubectl rollout status statefulset/employee-management-postgresql -n employee-management --timeout=30s >/dev/null

                echo SUCCESS
              " \
              --query 'value[0].message' \
              --output tsv)

            if ! echo "${VERIFY_OUTPUT}" | grep -q "SUCCESS"; then
                echo "Deployment verification failed."
                exit 1
            fi

            echo "Deployment verified successfully."
 
      # ========================================================================
      # FIX 2: Correct Verify Deployment Status implementation
      # VERIFICATION_SCRIPT contains ONLY commands that execute ON THE JUMP VM
      # Azure CLI commands are executed OUTSIDE the script definition
      # ========================================================================
      - name: Verify Deployment Status
        uses: azure/CLI@v1
        with:
          inlineScript: |
            set -e
 
            JUMP_VM_NAME="${{ steps.terraform.outputs.jump_vm_name }}"
            RESOURCE_GROUP="${{ steps.terraform.outputs.resource_group }}"
 
            echo "📊 Verifying deployment status on private AKS cluster..."
            echo ""
 
            # FIX 2: Define VERIFICATION_SCRIPT with ONLY Jump VM commands
            # This script executes entirely on the Jump VM using its kubeconfig
            # No Azure CLI commands are embedded in this script
            VERIFICATION_SCRIPT="
            set -Eeuo pipefail
 
            echo 'Checking Kubernetes pod status in employee-management namespace...'
            echo ''
 
            # FIX 3: Simplified pod status check (no JSON parsing)
            echo 'Current pod status:'
            kubectl get pods -n employee-management
            echo ''
 
            # FIX 3: Fail if unhealthy pods detected
            if kubectl get pods -n employee-management | grep -E 'CrashLoopBackOff|Error|Failed'; then
              echo '❌ ERROR: Unhealthy pods detected'
              exit 1
            fi
 
            echo ''
            echo 'Checking Helm release status...'
            echo ''
 
            # FIX 4: Use helm status command (not JSON parsing)
            HELM_STATUS=\$(helm status employee-management -n employee-management)
 
            echo \"\${HELM_STATUS}\"
            echo ''
 
            # FIX 4: Validate Helm release status is deployed
            if ! echo \"\${HELM_STATUS}\" | grep -q '^STATUS: deployed'; then
              echo '❌ ERROR: Helm release is not deployed'
              exit 1
            fi
 
            echo '✅ Helm release status is deployed'
            echo ''
            echo '✅ All deployment verifications passed'
            "
 
            # FIX 2: Execute VERIFICATION_SCRIPT on Jump VM
            # Azure CLI command is executed OUTSIDE the script definition
            az vm run-command invoke \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${JUMP_VM_NAME}" \
              --command-id RunShellScript \
              --scripts "${VERIFICATION_SCRIPT}"
 
            echo ""
            echo "✅ Deployment verification complete"
 
      - name: Deployment Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DEPLOYMENT SUCCESSFUL"
