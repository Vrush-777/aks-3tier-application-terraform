name: Build, Push, and Deploy to Private AKS

# FIX 4: Deployment Trigger Strategy
# =========================================================================
# RISK: Multiple triggers (workflow_run + push) targeting the same paths
# can cause DUPLICATE DEPLOYMENTS during rapid commits after Terraform runs.
#
# Current configuration:
# - workflow_run: Triggered when "Terraform Infrastructure Pipeline" completes
# - push: Triggered on commits to main with changes in ems-backend/, ems-fullstack/, helm/
# - workflow_dispatch: Manual trigger
#
# RECOMMENDATION - Choose ONE approach:
# 
# OPTION A (Recommended):
#   Use workflow_run + workflow_dispatch only
#   - Prevents duplicate deployments after infrastructure changes
#   - Requires manual trigger for non-infrastructure updates
#   - Change: Comment out 'push' trigger below
#
# OPTION B:
#   Use push + workflow_dispatch only
#   - Deploys on every code change
#   - Removes dependency on infrastructure pipeline completion
#   - Change: Comment out 'workflow_run' trigger below
#
# Current Implementation: Both triggers enabled (potential duplicates possible)
# =========================================================================

on:
  workflow_run:
    workflows:
      - Terraform Infrastructure Pipeline
    types:
      - completed

  push:
    branches:
      - test
    paths:
      - 'ems-backend/**'
      - 'ems-fullstack/**'
      - 'helm/**'



  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.TF_VAR_TENANT_ID }}
  ACR_NAME: ${{ secrets.TF_VAR_ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ secrets.TF_VAR_ACR_NAME }}.azurecr.io
  AKS_CLUSTER_NAME: ${{ secrets.TF_VAR_AKS_CLUSTER_NAME }}
  RESOURCE_GROUP: ${{ secrets.TF_VAR_RESOURCE_GROUP_NAME }}
  HELM_CHART_PATH: ./helm/employee-management-system
  DEPLOYMENT_NAMESPACE: employee-management
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

jobs:
  # =========================================================================
  # Job 1: Detect Changes
  # =========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
      helm-changed: ${{ steps.changes.outputs.helm }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          filters: |
            backend:
              - 'ems-backend/**'
            frontend:
              - 'ems-fullstack/**'
            helm:
              - 'helm/**'

  # =========================================================================
  # Job 2: Build Backend
  # =========================================================================
  build-backend:
    name: Build and Push Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend-changed == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./ems-backend

    outputs:
      backend-image-tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Generate image tag
        id: image-tag
        run: |
          # Use git short SHA for image tag
          TAG=$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Backend JAR
        run: mvn clean package -DskipTests -q

      - name: Publish Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: 'ems-backend/target/surefire-reports/**/*.xml'
          check_name: 'Backend Test Results'

      - name: Azure Login (Service Principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Build and Push backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./ems-backend
          file: ./docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/ems-backend:${{ steps.image-tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/ems-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Job 3: Build Frontend
  # =========================================================================
  build-frontend:
    name: Build and Push Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-changed == 'true' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: ./ems-fullstack

    outputs:
      frontend-image-tag: ${{ steps.image-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Generate image tag
        id: image-tag
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${TAG}"

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './ems-fullstack/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Azure Login (Service Principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./ems-fullstack
          file: ./docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/ems-frontend:${{ steps.image-tag.outputs.tag }}
            ${{ env.ACR_LOGIN_SERVER }}/ems-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# =========================================================================
# Job 4: Deploy to Private AKS via Jump VM
# =========================================================================
deploy-to-aks:
  name: Deploy to Private AKS
  runs-on: ubuntu-latest

  needs:
    - detect-changes
    - build-backend
    - build-frontend

  if: |
    needs.build-backend.result == 'success' ||
    needs.build-frontend.result == 'success'

    steps:

        - name: Checkout code
          uses: actions/checkout@v4
          with:
            ref: ${{ github.event.workflow_run.head_sha || github.sha }}

        - name: Azure Login
          uses: azure/login@v2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        - name: Determine image tag
          id: image
          shell: bash
          run: |
            if [ -n "${{ needs.build-backend.outputs.backend-image-tag }}" ]; then
              IMAGE_TAG="${{ needs.build-backend.outputs.backend-image-tag }}"
            elif [ -n "${{ needs.build-frontend.outputs.frontend-image-tag }}" ]; then
              IMAGE_TAG="${{ needs.build-frontend.outputs.frontend-image-tag }}"
            else
              echo "No image tag found"
              exit 1
            fi

            echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

        - name: Package Helm Chart
          run: |
            rm -rf deploy-pkg
            mkdir -p deploy-pkg

            cp -r "${{ env.HELM_CHART_PATH }}" deploy-pkg/

            tar -czf deploy-artifacts.tar.gz deploy-pkg

            ls -lh deploy-artifacts.tar.gz

        - name: Upload Helm package to Jump VM
          uses: azure/CLI@v2
          with:
            inlineScript: |
              set -e

              JUMP_VM="${{ secrets.JUMP_VM_NAME }}"

              echo "Encoding Helm package..."

              ARCHIVE_BASE64=$(base64 -w 0 deploy-artifacts.tar.gz)

              az vm run-command invoke \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --name "$JUMP_VM" \
                --command-id RunShellScript \
                --scripts "
                  mkdir -p /tmp

                  cat <<'EOF' >/tmp/deploy-artifacts.tar.gz.b64
                  ${ARCHIVE_BASE64}
                  EOF

                  base64 -d /tmp/deploy-artifacts.tar.gz.b64 > /tmp/deploy-artifacts.tar.gz

                  rm -f /tmp/deploy-artifacts.tar.gz.b64

                  ls -lh /tmp/deploy-artifacts.tar.gz
                "

        - name: Execute deploy.sh
          uses: azure/CLI@v2
          with:
            inlineScript: |
              set -e

              JUMP_VM="${{ secrets.JUMP_VM_NAME }}"
              IMAGE_TAG="${{ steps.image.outputs.image_tag }}"

              DEPLOY_OUTPUT=$(az vm run-command invoke \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --name "$JUMP_VM" \
                --command-id RunShellScript \
                --scripts "
                  sudo /opt/deploy/deploy.sh \
                  '${{ env.RESOURCE_GROUP }}' \
                  '${{ env.AKS_CLUSTER_NAME }}' \
                  '${IMAGE_TAG}' \
                  '${{ env.ACR_LOGIN_SERVER }}' \
                  '${{ env.AZURE_SUBSCRIPTION_ID }}' \
                  '/tmp/deploy-artifacts.tar.gz'
                " \
                --query value[0].message \
                -o tsv)

              echo "$DEPLOY_OUTPUT"

              echo "$DEPLOY_OUTPUT" | grep DEPLOYMENT_STATUS=SUCCESS

        - name: Verify Deployment
          uses: azure/CLI@v2
          with:
            inlineScript: |
              JUMP_VM="${{ secrets.JUMP_VM_NAME }}"

              az vm run-command invoke \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --name "$JUMP_VM" \
                --command-id RunShellScript \
                --scripts "
                  helm status employee-management -n employee-management

                  kubectl get all -n employee-management

                  kubectl wait \
                    --for=condition=ready pod \
                    --all \
                    -n employee-management \
                    --timeout=300s
                "

        - name: Deployment Summary
          if: success()
          run: |

            echo "====================================="
            echo "DEPLOYMENT SUCCESSFUL"
            echo "====================================="

            echo "Backend:"
            echo "${{ env.ACR_LOGIN_SERVER }}/ems-backend:${{ steps.image.outputs.image_tag }}"

            echo ""

            echo "Frontend:"
            echo "${{ env.ACR_LOGIN_SERVER }}/ems-frontend:${{ steps.image.outputs.image_tag }}"

            echo ""

            echo "Namespace:"
            echo "employee-management"

        - name: Notify Failure
          if: failure()
          run: |

            echo "DEPLOYMENT FAILED"

            echo "Check:"
            echo "/opt/deploy/logs"

            exit 1
  # =========================================================================
  # Job 5: Post-Deployment Validation
  # =========================================================================
  validate-deployment:
    name: Validate Deployment
    runs-on: ubuntu-latest
    needs: [deploy-to-aks]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run Smoke Tests
        run: |
          echo "🧪 Running smoke tests..."

          # Add your smoke test commands here
          # Example: test API endpoints, verify pods are running, etc.

          echo "✅ Smoke tests completed"
          echo "✅ Smoke tests completed"
